; DUT (STM32 #1): runs the onboard FDIR code and answers a framed UART protocol
; (firmware/pio/dut/src/main.c, host side verify/hil_ekf.py).
; Board: WeAct Black Pill STM32F411CEU6 (DEV_ID 0x431, 512 KB), flashed with ST-Link.
; UART: USART1 on PA9 (TX) / PA10 (RX), 460800 8N1 (UART_BAUD in main.c).
[env:dut]
platform = ststm32
board = blackpill_f411ce
framework = cmsis
upload_protocol = stlink
debug_tool = stlink
monitor_port = COM5
monitor_speed = 460800
; the CMSIS framework builds soft-float by default: force the Cortex-M4F FPU
; (compile flags here, link flags in hardfloat_link.py)
build_flags =
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16
    -std=c99
    -Wall
    -Wextra
    -Werror
    -Wdouble-promotion
    -ffp-contract=off
    -fno-math-errno
    -O2
    -I../../include
    -DFDIR_TREE_IN_RAM
extra_scripts = pre:hardfloat_link.py
; the flight sources live in firmware/src; compile them as part of this project
build_src_filter = +<*> +<../../../src/soc_ekf.c> +<../../../src/fdir_tree.c> +<../../../src/fdir_onboard.c> +<../../../src/fdir_sgo_v3.c> +<../../../src/fdir_features.c>

; timing / SWaP sweep (item 5): same firmware at other clocks; flash wait states and
; voltage scale follow RM0383 Table 6 inside clock_init()
[env:f32]
extends = env:dut
build_flags = ${env:dut.build_flags} -DSYSCLK_MHZ=32U
[env:f48]
extends = env:dut
build_flags = ${env:dut.build_flags} -DSYSCLK_MHZ=48U
[env:f64]
extends = env:dut
build_flags = ${env:dut.build_flags} -DSYSCLK_MHZ=64U
[env:f84]
extends = env:dut
build_flags = ${env:dut.build_flags} -DSYSCLK_MHZ=84U
[env:f100]
extends = env:dut
build_flags = ${env:dut.build_flags} -DSYSCLK_MHZ=100U
[env:f100_noart]
extends = env:dut
build_flags = ${env:dut.build_flags} -DSYSCLK_MHZ=100U -DART=0
[env:f16_noart]
extends = env:dut
build_flags = ${env:dut.build_flags} -DART=0
[env:bench]
; bench pack 8S1P US18650VTC6 (fdir_config_bench.h); same code, tree and proofs as env:dut (ref)
extends = env:dut
build_flags = ${env:dut.build_flags} -DFDIR_CONFIG_BENCH
